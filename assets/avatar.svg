<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="av-t">
<title id="av-t">Ilustração de Muriel Queiroz, de blazer verde e camisa branca, acenando</title>
<defs>
  <clipPath id="av-c"><circle cx="120" cy="120" r="116"/></clipPath>
</defs>
<circle cx="120" cy="120" r="116" fill="#17413a"/>
<circle cx="120" cy="120" r="116" fill="none" stroke="#8fd9bd" stroke-width="4"/>
<g clip-path="url(#av-c)">
  <!-- gráfico em degraus ao fundo -->
  <path d="M10 196 H70 V170 H130 V140 H190 V112 H232" fill="none" stroke="#2a564d" stroke-width="3"/>
  <g class="av-body">
    <g transform="translate(0 -12)">
    <!-- corpo -->
    <path d="M44 250 C46 196 74 178 120 176 C166 178 194 196 196 250 Z" fill="#0f2e28"/>
    <!-- camisa -->
    <path d="M100 178 L120 214 L140 178 Z" fill="#f6f7f5"/>
    <!-- gravata -->
    <path d="M114 186 L126 186 L123 196 L127 226 L120 234 L113 226 L117 196 Z" fill="#f2c46d"/>
    <!-- lapelas -->
    <path d="M100 178 L120 214 L108 222 L90 184 Z" fill="#1f6b57"/>
    <path d="M140 178 L120 214 L132 222 L150 184 Z" fill="#1f6b57"/>
    <!-- broche com a logo -->
    <rect x="150" y="204" width="14" height="14" rx="3.5" fill="#1f6b57" stroke="#8fd9bd" stroke-width="1.2"/>
    <path d="M153.2 215V207.6l3.4 4 2.4-2.9V215" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- pescoço -->
    <path d="M107 148 H133 V168 C126 174 114 174 107 168 Z" fill="#9c6340"/>
    <!-- cabeça -->
    <ellipse cx="81" cy="118" rx="7" ry="10" fill="#a86b45"/>
    <ellipse cx="159" cy="118" rx="7" ry="10" fill="#a86b45"/>
    <ellipse cx="120" cy="112" rx="38" ry="44" fill="#b9784c"/>
    <!-- cabelo cacheado -->
    <g fill="#1d1612">
      <circle cx="88" cy="86" r="14"/><circle cx="102" cy="74" r="15"/><circle cx="120" cy="70" r="16"/>
      <circle cx="138" cy="74" r="15"/><circle cx="152" cy="86" r="14"/><circle cx="82" cy="100" r="10"/>
      <circle cx="158" cy="100" r="10"/><circle cx="110" cy="80" r="12"/><circle cx="130" cy="80" r="12"/>
    </g>
    <g fill="#2c221c">
      <circle cx="96" cy="72" r="5"/><circle cx="118" cy="62" r="5"/><circle cx="142" cy="70" r="5"/><circle cx="156" cy="84" r="4"/>
    </g>
    <!-- sobrancelhas -->
    <path d="M98 104 q8 -5 16 -1" fill="none" stroke="#1d1612" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M126 103 q8 -4 16 1" fill="none" stroke="#1d1612" stroke-width="3.2" stroke-linecap="round"/>
    <!-- olhos -->
    <g class="av-eyes" fill="#1d1612">
      <ellipse cx="106" cy="116" rx="4" ry="5"/>
      <ellipse cx="134" cy="116" rx="4" ry="5"/>
    </g>
    <!-- nariz e sorriso -->
    <path d="M120 120 q-3 10 1 12" fill="none" stroke="#8a5536" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M107 138 q13 11 26 0" fill="none" stroke="#5b3221" stroke-width="3.2" stroke-linecap="round"/>
    <ellipse cx="98" cy="130" rx="6" ry="3.5" fill="#c9856a" opacity=".45"/>
    <ellipse cx="142" cy="130" rx="6" ry="3.5" fill="#c9856a" opacity=".45"/>
  </g>
  <!-- braço acenando -->
  <g class="av-arm">
    <path d="M78 196 C62 186 54 172 50 158" fill="none" stroke="#0f2e28" stroke-width="22" stroke-linecap="round"/>
    <path d="M49 156 L47 150" fill="none" stroke="#f6f7f5" stroke-width="20" stroke-linecap="round"/>
    <g fill="#b9784c">
      <ellipse cx="45" cy="134" rx="13" ry="15"/>
      <rect x="34" y="112" width="6" height="20" rx="3"/>
      <rect x="41" y="108" width="6" height="22" rx="3"/>
      <rect x="48" y="110" width="6" height="21" rx="3"/>
      <rect x="55" y="128" width="6" height="16" rx="3" transform="rotate(35 58 136)"/>
    </g>
  </g>
</g>
</svg>
